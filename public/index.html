<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新竹市衛生局 - 會議室預約管理系統</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%230d9488'/%3E%3Cpath d='M22 35h56v45H22z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M22 35h56v14H22z' fill='white'/%3E%3Cpath d='M34 22v16M66 22v16' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Crect x='34' y='57' width='10' height='9' rx='2' fill='white'/%3E%3Crect x='56' y='57' width='10' height='9' rx='2' fill='white'/%3E%3Crect x='34' y='70' width='10' height='9' rx='2' fill='white'/%3E%3Crect x='56' y='70' width='10' height='9' rx='2' fill='white'/%3E%3C/svg%3E">

  <!-- Suppress Tailwind CDN Production Warning -->
  <script>
    (function() {
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
          return;
        }
        origWarn.apply(console, args);
      };
    })();
  </script>

  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@1.28.0" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- Application Core Script -->
  <script src="js/app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-teal-500 selection:text-white">

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-[110] flex flex-col gap-2.5 pointer-events-none"></div>

  <!-- Custom Confirmation Dialog Modal -->
  <div id="confirm-modal" onclick="if(event.target===this) document.getElementById('confirm-cancel-btn').click()" role="dialog" aria-modal="true" class="fixed inset-0 z-[100] bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200 animate-fade-in">
      <div id="confirm-title" class="font-bold text-base text-slate-800 mb-2">確認提示</div>
      <div id="confirm-msg" class="text-xs text-slate-600 mb-6 leading-relaxed">確定要執行此操作嗎？</div>
      <div class="flex items-center justify-end gap-3 text-xs">
        <button id="confirm-cancel-btn" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-100 transition font-medium">取消</button>
        <button id="confirm-ok-btn" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-xl shadow-md transition">確定執行</button>
      </div>
    </div>
  </div>

  <!-- App Main Content Container -->
  <div id="app" class="min-h-screen flex flex-col"></div>

</body>
</html>
