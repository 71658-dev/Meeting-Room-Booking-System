<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="會議室預約系統">
  <!--
    Liquid Glass mark: System Blue squircle, white calendar, one day taken.

    The header's brand mark (衛 on blue) is not reusable here — at 16px a 15-stroke
    character collapses into a smudge. This keeps the header's colour and rounded tile
    and states the product instead. Kept to a handful of shapes: at a 16px tab size
    anything finer than the silhouette, the header band and one filled cell blurs out.
  -->
  <rect width="32" height="32" rx="8" fill="#0088FF"/>

  <!-- Binding tabs -->
  <rect x="10" y="4" width="3" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="19" y="4" width="3" height="5" rx="1.5" fill="#ffffff"/>

  <!-- Calendar body -->
  <rect x="5" y="7" width="22" height="20" rx="3" fill="#ffffff"/>

  <!-- Header band -->
  <rect x="5" y="7" width="22" height="5" fill="#0088FF" fill-opacity=".35"/>

  <!-- The booked day -->
  <rect x="12" y="16" width="8" height="7" rx="2" fill="#0088FF"/>
</svg>
